[package]
name = "packarch-folder-color"
version = "0.1.4"
edition = "2024"
description = "Change the folder color of icon themes"
license = "GPL-3.0-or-later"
repository = "https://github.com/packarch/packarch-folder-color"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
regex = "1.13.1"
resvg = "0.49.0"
